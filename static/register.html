<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Federated MicroBlog</title>
    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="d-flex align-items-center py-4 bg-body-tertiary">
    <div class="container">
        <div clas="row">
            <div class="alert alert-danger" role="alert">
                <strong>Never enter your BA number and password here.</strong>
            </div>
        </div>
        <div class="row">
            <main class="d-flex w-100 m-auto justify-content-center">
                <form action="/user" method="POST" enctype="application/x-www-form-urlencoded" class="col-3">
                    <h1 class="h3 mb-3 fw-normal">Sign Up</h1>
                    <div class="form-floating">
                        <input type="text" class="form-control" id="username" name="username" placeholder="Alice">
                        <label for="username">Username</label>
                    </div>
                    <div class="form-floating">
                        <input type="password" class="form-control" id="password" name="password"
                            placeholder="Password">
                        <label for="password">Password</label>
                    </div>
                    <button class="btn btn-primary w-100 py-2" type="submit">Sign Up</button>
                </form>
            </main>
        </div>
    </div>
</body>

</html>
